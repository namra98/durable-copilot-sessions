[workspace]
resolver = "2"
members = [
  "rust/dcs",
  "rust/dcs-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
dcs-core = { path = "rust/dcs-core" }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
sha1 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.12", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
