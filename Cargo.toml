[workspace]
resolver = "2"
members = [
  "rust/dcs",
  "rust/dcs-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
dcs-core = { path = "rust/dcs-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1.12", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
